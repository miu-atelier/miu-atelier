
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Miu Atelier｜白瀬みうのAIフォトコレクション">
  <title>Miu Atelier | 白瀬みう</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #faf7f6;
      color: #302a2b;
      font-family: -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", sans-serif;
      line-height: 1.7;
    }

    header {
      padding: 18px 20px;
      text-align: center;
      background: #f2e7e7;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: .08em;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px;
    }

    .hero {
      margin: 0 0 32px;
    }

    .hero img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
    }

    section {
      margin-bottom: 40px;
    }

    h2 {
      font-size: 22px;
      margin: 0 0 14px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px #00000008;
    }

    .card h3 {
      margin-top: 0;
      font-size: 19px;
    }

    .price {
      font-weight: bold;
      color: #a76c7c;
      font-size: 20px;
    }

    .notice {
      color: #796c70;
      font-size: 14px;
    }

    footer {
      padding: 32px 20px;
      text-align: center;
      color: #82777a;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Miu Atelier</h1>
  </header>

  <main>

    <!-- 代表写真 -->
    <section class="hero">
      <img
        src="39CA2AA7-CDB6-497E-B7B4-91E2D59A04CE.png"
        alt="Miu Atelier 白瀬みうの代表写真"
        fetchpriority="high"
      >
    </section>

    <!-- 写真集 -->
    <section id="photobook">
      <h2>Photo Book</h2>

      <div class="card">
        <h3>Vol.01 — はじめまして、みうです。</h3>

        <p>
          白瀬みうの初めてのAIフォトコレクション。
          何気ない日常や、少し特別な瞬間を
          20枚の写真にまとめました。
        </p>

        <p class="price">全20枚 · 500円</p>

        <p class="notice">
          noteで販売中です。
          購入リンクは準備中です。
        </p>
      </div>
    </section>

    <!-- 無料ギャラリー -->
    <section id="gallery">
      <h2>Gallery</h2>

      <div class="card">
        <p>無料フォトギャラリーは準備中です。</p>
      </div>
    </section>

    <!-- 自己紹介 -->
    <section id="about">
      <h2>About Miu</h2>

      <div class="card">
        <p>はじめまして、白瀬みうです。</p>

        <p>
          何気ない日常や、
          ふとした瞬間を写真に残しています。
        </p>

        <p>
          ここでは私のフォトコレクションを
          紹介します。
        </p>
      </div>
    </section>

  </main>

  <footer>
    <p>白瀬みうは架空のAIキャラクターです。</p>
    <p>© 2026 Miu Atelier</p>
  </footer>

</body>
</html>
